<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D&V Ventas">
<title>D&V Ventas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --bg:#f4f1ec; --card:#fff; --ink:#16130f; --muted:#6f685f; --line:#e4ded5;
  --brand:#E85D26; --ok:#1f8a4c; --bad:#c0392b; --info:#2b6cb0;
  --r:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,sans-serif;font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,.cond{font-family:'Barlow Condensed',sans-serif;letter-spacing:.3px;margin:0}
a{color:inherit}
.hidden{display:none!important}

header{position:sticky;top:0;z-index:500;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header .logo{font-family:'Barlow Condensed';font-weight:800;font-size:22px}
header .logo b{color:var(--brand)}
header .title{flex:1;font-family:'Barlow Condensed';font-weight:700;font-size:18px;opacity:.85;text-transform:uppercase}
header .sync{font-size:12px;opacity:.75}
main{padding:14px 14px calc(96px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:500;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:var(--muted)}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--brand)}

.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.big{font-size:22px;font-weight:700}
.right{text-align:right}
.sep{height:1px;background:var(--line);margin:12px 0}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;cursor:pointer;text-decoration:none;text-align:center}
.btn.brand{background:var(--brand)}
.btn.ok{background:var(--ok)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.wa{background:#1fa855}
.btn.sm{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.xs{min-height:30px;padding:4px 9px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.badge{display:inline-block;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.b-Consulta{background:#eef2f7;color:#41526b}
.b-Presupuestado{background:#fff4e0;color:#8a5a00}
.b-Confirmado{background:#e6f0fb;color:#1f5a9e}
.b-Entregado{background:#e3f4ea;color:#1b6d3e}
.b-Perdido{background:#f6e5e3;color:#99332a}
.b-cobrado{background:#e3f4ea;color:#1b6d3e}
.b-debe{background:#fde8e1;color:#a03b13}
.b-geo{background:#e3f4ea;color:#1b6d3e}
.b-nogeo{background:#fff4e0;color:#8a5a00}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input.i,select.i,textarea.i{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;background:#fff;font-size:16px;outline:none}
input.i:focus,select.i:focus,textarea.i:focus{border-color:var(--brand)}
textarea.i{min-height:70px;resize:vertical}
.search{position:relative;margin-bottom:10px}
.search input{padding-left:38px}
.search:before{content:'🔍';position:absolute;left:12px;top:11px;font-size:15px;opacity:.6}
.list-item{cursor:pointer}
.list-item .name{font-weight:700;font-size:16.5px}
.empty{text-align:center;color:var(--muted);padding:34px 10px}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:450;border-radius:999px;box-shadow:0 6px 18px rgba(232,93,38,.4);padding:14px 20px;font-size:16px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-family:'Barlow Condensed';font-size:26px;font-weight:700;margin-top:2px}
.bar{height:12px;background:#ece6dd;border-radius:999px;overflow:hidden}
.bar>div{height:100%;background:var(--brand);border-radius:999px}
.hbar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.hbar .t{width:120px;flex:none}
.hbar .b{flex:1;height:10px;background:#ece6dd;border-radius:999px;overflow:hidden}
.hbar .b>div{height:100%;background:var(--ink)}
.hbar .n{width:34px;text-align:right;font-weight:700}

.sheet{position:fixed;inset:0;z-index:900;background:var(--bg);overflow-y:auto;display:none}
.sheet.open{display:block}
.sheet .sh-head{position:sticky;top:0;z-index:2;background:var(--ink);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px}
.sheet .sh-head h2{flex:1;font-size:20px;text-transform:uppercase}
.sheet .sh-head button{background:none;border:0;color:#fff;font-size:15px;font-weight:700;padding:8px}
.sheet .sh-body{padding:14px 14px 120px;max-width:720px;margin:0 auto}
.sheet .sh-foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:3}

.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.stepper{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.stepper button{border:0;background:#faf8f5;width:34px;height:34px;font-size:18px;font-weight:700}
.stepper input{width:42px;border:0;text-align:center;font-weight:700;height:34px;outline:none}
.prod-pick{display:grid;gap:8px}
.prod-pick .pp{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.prod-pick .pp .n{font-weight:700;font-size:15px}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sizes button{border:1.5px solid var(--line);background:#faf8f5;border-radius:10px;padding:6px 10px;font-size:13.5px;font-weight:600;cursor:pointer;text-align:left}
.sizes button small{display:block;color:var(--muted);font-weight:500}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0}
.tot.main{font-family:'Barlow Condensed';font-size:26px;font-weight:800}
.seg{display:flex;background:#ece6dd;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;font-size:14px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:var(--shadow)}
.estado-steps{display:flex;gap:6px;flex-wrap:wrap}
.estado-steps button{flex:1 1 auto;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 8px;font-size:13.5px;font-weight:700;cursor:pointer}
.estado-steps button.on{border-color:var(--ink);background:var(--ink);color:#fff}
.calc{background:#fff8f3;border:1.5px dashed #f0b896;border-radius:12px;padding:12px;margin-top:10px}
.geo{background:#f7f5f1;border-radius:12px;padding:10px 12px;margin-top:10px}

/* Reparto */
#mapa{height:260px;border-radius:var(--r);overflow:hidden;margin-bottom:10px;box-shadow:var(--shadow);background:#e8e4dc}
.pin{background:var(--ink);color:#fff;border:2px solid #fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin.next{background:var(--brand)}
.pin.start{background:var(--ok)}
.stop{display:flex;gap:10px}
.stop .num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Barlow Condensed';font-size:18px}
.stop.next .num{background:var(--brand)}
.stop .eta{font-family:'Barlow Condensed';font-weight:800;font-size:20px}
.next-card{border:2px solid var(--brand)}
.reorder{display:flex;flex-direction:column;gap:4px}
.reorder button{border:1.5px solid var(--line);background:#fff;border-radius:8px;width:32px;height:28px;font-size:14px;cursor:pointer}
details.done summary{cursor:pointer;font-weight:700;padding:8px 2px;color:var(--muted)}

/* Login */
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:var(--ink);color:#fff}
.login .logo{font-family:'Barlow Condensed';font-weight:800;font-size:40px}
.login .logo b{color:var(--brand)}
.login form{width:100%;max-width:340px;margin-top:22px}
.login input.i{background:#2a251f;border-color:#3a342c;color:#fff}
.login .err{color:#ff9b78;min-height:22px;margin-top:10px;font-weight:600;text-align:center}
.login a{color:#bbb;font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:1000;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.demo-banner{background:#fff4e0;color:#8a5a00;font-size:13px;font-weight:600;padding:8px 14px;text-align:center}
.tpl{white-space:pre-wrap;font-size:14.5px;line-height:1.4;background:#faf8f5;border-radius:10px;padding:10px;margin:8px 0}
</style>
</head>
<body>

<div id="login" class="login hidden">
  <div class="logo">Deco <b>&</b> Vita</div>
  <div style="color:#bbb">Ventas · Reparto · Administración</div>
  <form onsubmit="event.preventDefault();entrar()">
    <div id="loginCampos">
      <input class="i" id="lEmail" type="email" autocomplete="username" placeholder="Email" style="margin-bottom:10px">
      <input class="i" id="lPass" type="password" autocomplete="current-password" placeholder="Contraseña">
      <button class="btn brand block" style="margin-top:14px" id="lBtn">Entrar</button>
    </div>
    <div id="loginDemo" class="hidden" style="text-align:center">
      <div style="color:#bbb;font-size:14px;margin-bottom:12px">Todavía no está conectada la base de datos.</div>
      <button type="button" class="btn brand block" onclick="entrarDemo()">Entrar en modo prueba</button>
      <a href="#" onclick="event.preventDefault();$('loginConf').classList.toggle('hidden')" style="display:block;margin-top:16px">Conectar Supabase</a>
    </div>
    <div id="loginConf" class="hidden" style="margin-top:14px">
      <input class="i" id="cUrl" placeholder="URL del proyecto (https://xxxx.supabase.co)" style="margin-bottom:8px">
      <input class="i" id="cKey" placeholder="anon public key">
      <button type="button" class="btn ghost block" style="margin-top:10px" onclick="guardarConexion($('cUrl').value,$('cKey').value)">Guardar conexión</button>
    </div>
    <div class="err" id="lErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <div class="logo">D<b>&</b>V</div>
    <div class="title" id="hTitle"></div>
    <div class="sync" id="hSync"></div>
  </header>
  <div class="demo-banner hidden" id="demoBanner">Modo prueba: los datos quedan solo en este celular.</div>
  <main id="view"></main>
  <nav class="tabs" id="tabs"></nav>
</div>

<div class="sheet" id="sheet">
  <div class="sh-head"><button onclick="closeSheet()">✕</button><h2 id="shTitle"></h2></div>
  <div class="sh-body" id="shBody"></div>
  <div class="sh-foot hidden" id="shFoot"></div>
</div>

<script>
/* =====================================================================
   DECO & VITA — App de ventas, reparto y administración
   Base de datos: Supabase (ver supabase_schema.sql). Sin conexión
   configurada funciona en "modo prueba" guardando en este navegador.
   ===================================================================== */

// ⬇️ Datos del proyecto de Supabase (Project Settings → API). La anon key es pública por diseño:
// lo que protege los datos es el login + las reglas de seguridad de la base.
const SUPABASE_URL = '';
const SUPABASE_ANON_KEY = '';

const ESTADOS = ['Consulta','Presupuestado','Confirmado','Entregado','Perdido'];
const ORIGENES = ['Meta / WhatsApp','Web','Instagram orgánico','Referido','Llamada mayorista','Otro'];
const MEDIOS = ['Transferencia','Efectivo','Tarjeta / Mercado Pago'];
const TIPOS_CLI = ['Minorista','Mayorista','Prospecto mayorista'];
const ESTADOS_PROSP = ['Sin contactar','Contactado','Interesado','Cliente','Descartado'];
const CAT_GASTOS = ['Publicidad','Nafta / envíos','Fábrica (fletes)','Otros'];
const VENDIDO = ['Confirmado','Entregado'];
const COLS = {
  productos: ['id','nombre','linea','medida','unidad','costo','activo'],
  clientes:  ['id','alta','nombre','telefono','direccion','zona','lat','lng','tipo','origen','estado_prospecto','proximo_contacto','notas'],
  pedidos:   ['id','fecha','cliente_id','cliente_nombre','telefono','direccion','lat','lng','tipo_precio','items','total','costo_total','comision','ganancia','estado','fecha_entrega','orden_ruta','entregado_at','medio_pago','cobrado','origen','notas'],
  gastos:    ['id','fecha','categoria','monto','nota'],
  config:    ['clave','valor','descripcion'],
};
const FECHAS = ['alta','proximo_contacto','fecha','fecha_entrega','entregado_at'];
const NUMS = ['lat','lng','medida','costo','total','costo_total','comision','ganancia','orden_ruta','monto'];

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} },
};

const conexion = SUPABASE_URL ? { url:SUPABASE_URL, key:SUPABASE_ANON_KEY } : LS.get('dv_sb', null);
let sb = null;
try { if (conexion && conexion.url && window.supabase) sb = window.supabase.createClient(conexion.url, conexion.key); } catch(e) { sb = null; }
let DEMO = false;

let S = { config:{}, productos:[], clientes:[], pedidos:[], gastos:[] };
let TAB = LS.get('dv_tab', 'pedidos');
let UI = { pedFiltro:'Activos', pedBusca:'', cliFiltro:'Todos', cliBusca:'', repFecha:null, fabFecha:null, mes:null };

/* ----------------------------- utilidades ----------------------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = Number(String(v ?? '').replace(',', '.')); return isFinite(n) ? n : 0; };
const r10 = n => Math.round(n / 10) * 10;
const fmt = n => '$' + Math.round(num(n)).toLocaleString('es-AR');
const hoy = () => isoDate(new Date());
const esSi = v => v === true || String(v) === 'true';
const tieneGeo = o => o && o.lat !== null && o.lat !== undefined && o.lat !== '' && o.lng !== null && o.lng !== undefined && o.lng !== '';
function isoDate(d){ const z = n => String(n).padStart(2,'0'); return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate()); }
function parseDate(s){ if(!s) return null; const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return new Date(y, m-1, d); }
const DIAS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const DIAS_L = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fechaCorta(s){ const d = parseDate(s); return d ? DIAS[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1) : '—'; }
function fechaLarga(s){ const d = parseDate(s); return d ? DIAS_L[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth()+1) : ''; }
function hhmm(min){ min = Math.round(min); const h = Math.floor(min / 60) % 24, m = min % 60; return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'); }
function aMin(s){ const [h,m] = String(s || '09:30').split(':').map(Number); return (h||0) * 60 + (m||0); }
function proximosReparto(n = 4){
  const out = []; const d = new Date(); d.setHours(0,0,0,0);
  for (let i = 0; out.length < n && i < 30; i++){ const x = new Date(d); x.setDate(d.getDate() + i); if (x.getDay() === 2 || x.getDay() === 5) out.push(isoDate(x)); }
  return out;
}
function telWa(t){
  let d = String(t || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('549')) return d;
  if (d.startsWith('54')) return '549' + d.slice(2);
  if (d.startsWith('0')) d = d.slice(1);
  d = d.replace(/^(\d{2,4})15/, '$1');
  return '549' + d;
}
const waLink = (tel, texto) => 'https://wa.me/' + telWa(tel) + '?text=' + encodeURIComponent(texto || '');
const destino = o => tieneGeo(o) ? o.lat + ',' + o.lng : (o.direccion || '') + ', Córdoba, Argentina';
const mapsVer = o => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(destino(o));
const mapsIr = o => 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(destino(o));
function toast(msg){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function parseItems(v){ if (Array.isArray(v)) return v; try { return JSON.parse(v || '[]'); } catch(e){ return []; } }
function cfg(k, d){ const v = S.config[k]; return v === undefined || v === null || v === '' ? d : (isNaN(Number(v)) ? v : num(v)); }
function copiar(txt){
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Copiado ✓')).catch(() => fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(txt){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copiado ✓'); }catch(e){} ta.remove(); }
function nuevoId(pref){ return pref + Date.now().toString(36).toUpperCase() + Math.floor(Math.random()*1296).toString(36).toUpperCase(); }

/* ----------------------------- precios ----------------------------- */
function precioUnit(costo, tipo){
  const transf = r10(num(costo) * cfg('MARKUP', 1.35));
  if (tipo === 'tarjeta') return r10(transf * cfg('RECARGO_TARJETA', 1.5));
  if (tipo === 'mayorista') return r10(num(costo) * cfg('MARKUP_MAYORISTA', 1.15));
  return transf;
}
function calcPedido(p){
  const items = parseItems(p.items);
  const total = items.reduce((s, i) => s + num(i.precio) * num(i.cantidad), 0);
  const costo = items.reduce((s, i) => s + num(i.costo) * num(i.cantidad), 0);
  const comision = p.tipo_precio === 'tarjeta' ? Math.round(total * cfg('COMISION_TARJETA', 0.25)) : 0;
  return { total, costo_total: costo, comision, ganancia: total - costo - comision };
}
const unidadDe = (n, l) => /látex|latex/i.test((l||'') + ' ' + (n||'')) ? 'L' : 'kg';
function grupos(){
  const g = {};
  S.productos.filter(p => esSi(p.activo) || p.activo === undefined).forEach(p => {
    (g[p.nombre] = g[p.nombre] || { nombre:p.nombre, linea:p.linea, unidad:p.unidad || unidadDe(p.nombre,p.linea), tams:[] }).tams.push(p);
  });
  Object.values(g).forEach(x => x.tams.sort((a,b) => num(a.medida) - num(b.medida)));
  return Object.values(g);
}

/* ----------------------------- ubicación ----------------------------- */
// Acepta links de Google Maps / WhatsApp o coordenadas sueltas "-31.41, -64.18"
function parseUbicacion(txt){
  const s = String(txt || '');
  const pats = [/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/, /[?&](?:q|query|ll|destination|center)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i, /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/, /^\s*(-?\d{1,2}\.\d+)\s*[,; ]\s*(-?\d{1,3}\.\d+)\s*$/];
  for (const p of pats){ const m = s.match(p); if (m){ const lat = num(m[1]), lng = num(m[2]); if (Math.abs(lat) <= 90 && Math.abs(lng) <= 180) return { lat, lng }; } }
  return null;
}
async function geocodificar(dir){
  if (!dir || dir.trim().length < 4) return null;
  let q = dir.trim(); if (!/c[oó]rdoba/i.test(q)) q += ', Córdoba';
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&viewbox=-64.45,-31.20,-63.95,-31.60&q=' + encodeURIComponent(q);
  try{
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 6000);
    const res = await fetch(url, { signal: ctl.signal, headers:{ 'Accept-Language':'es' } });
    clearTimeout(to);
    const d = await res.json();
    if (d && d[0]) return { lat:num(d[0].lat), lng:num(d[0].lon), nombre:d[0].display_name };
  }catch(e){}
  return null;
}
function miUbicacion(){
  return new Promise((ok, mal) => {
    if (!navigator.geolocation) return mal(new Error('Este celular no da la ubicación'));
    navigator.geolocation.getCurrentPosition(p => ok({ lat:p.coords.latitude, lng:p.coords.longitude }), e => mal(new Error('No se pudo obtener la ubicación (¿permiso?)')), { enableHighAccuracy:true, timeout:12000 });
  });
}
function geoHTML(o, varName, redraw){
  return `<div class="geo">
    <div class="row"><div class="grow small"><b>Ubicación para el reparto</b></div>
      ${tieneGeo(o) ? `<span class="badge b-geo">✓ Ubicado</span>` : `<span class="badge b-nogeo">Sin ubicar</span>`}</div>
    ${tieneGeo(o) ? `<div class="small muted" style="margin-top:4px">${num(o.lat).toFixed(5)}, ${num(o.lng).toFixed(5)} · <a target="_blank" href="${mapsVer(o)}">ver en el mapa</a></div>` : ''}
    <input class="i" style="margin-top:8px" placeholder="Pegá la ubicación que mandó por WhatsApp o un link de Maps" onchange="ubicarDesdeTexto(${varName}, this.value, '${redraw}')">
    <div class="row wrap" style="margin-top:8px">
      <button class="btn ghost xs" onclick="ubicarDireccion(${varName}, '${redraw}')">🔎 Buscar la dirección</button>
      <button class="btn ghost xs" onclick="ubicarAca(${varName}, '${redraw}')">📍 Estoy en el lugar</button>
      ${tieneGeo(o) ? `<button class="btn ghost xs" onclick="${varName}.lat=null;${varName}.lng=null;${redraw}()">Borrar</button>` : ''}
    </div></div>`;
}
function ubicarDesdeTexto(o, txt, redraw){
  const g = parseUbicacion(txt);
  if (!g) return toast('No reconozco esa ubicación. Probá con “Buscar la dirección”.');
  o.lat = g.lat; o.lng = g.lng; toast('Ubicación cargada ✓'); window[redraw]();
}
async function ubicarDireccion(o, redraw){
  if (!o.direccion) return toast('Primero escribí la dirección');
  toast('Buscando…');
  const g = await geocodificar(o.direccion + (o.zona ? ', ' + o.zona : ''));
  if (!g) return toast('No la encontré. Pedile la ubicación por WhatsApp y pegala.');
  o.lat = g.lat; o.lng = g.lng; toast('Encontrada: ' + g.nombre.split(',').slice(0,3).join(',')); window[redraw]();
}
async function ubicarAca(o, redraw){
  try{ const g = await miUbicacion(); o.lat = g.lat; o.lng = g.lng; toast('Ubicación guardada ✓'); window[redraw](); }
  catch(e){ toast(e.message); }
}

async function cargarTodo(){

  ]);

function limpiar(tabla, fila){
  const out = {};
  COLS[tabla].forEach(k => {
    if (!(k in fila)) return;
    let v = fila[k];
    if (FECHAS.includes(k) && (v === '' || v === undefined)) v = null;
    if (NUMS.includes(k)) v = (v === '' || v === null || v === undefined) ? null : num(v);
    if (k === 'items') v = parseItems(v);
    out[k] = v;
  });
  return out;
}
async function guardar(tabla, fila){
  const pref = { clientes:'C', pedidos:'P', gastos:'G', productos:'X' }[tabla] || 'R';
  const nuevo = !fila.id || !S[tabla].some(x => String(x.id) === String(fila.id));
  if (!fila.id) fila.id = nuevoId(pref);
  const datos = limpiar(tabla, fila);
  if (!DEMO){
    setSync('Guardando…');
    const r = nuevo ? await sb.from(tabla).insert(datos) : await sb.from(tabla).update(datos).eq('id', datos.id);
    if (r.error){ setSync('⚠️'); toast('No se pudo guardar: ' + r.error.message); throw r.error; }
    setSync('✓'); setTimeout(() => setSync(''), 1200);
  }
  const arr = S[tabla]; const i = arr.findIndex(x => String(x.id) === String(datos.id));
  if (i >= 0) arr[i] = { ...arr[i], ...datos }; else arr.push({ ...datos });
  if (DEMO){ const db = demoDB(); db[tabla] = arr; LS.set('dv_demo2', db); }
  return datos;
}
async function guardarVarios(tabla, filas){
  // actualizaciones parciales (ej: orden de la ruta)
  for (const f of filas){
    const datos = limpiar(tabla, f);
    if (!DEMO){ const r = await sb.from(tabla).update(datos).eq('id', datos.id); if (r.error){ toast('No se pudo guardar: ' + r.error.message); throw r.error; } }
    const i = S[tabla].findIndex(x => String(x.id) === String(datos.id)); if (i >= 0) S[tabla][i] = { ...S[tabla][i], ...datos };
  }
  if (DEMO){ const db = demoDB(); db[tabla] = S[tabla]; LS.set('dv_demo2', db); }
}
async function guardarConfigClave(clave, valor){
  S.config[clave] = valor;
  if (DEMO){ const db = demoDB(); const f = db.config.find(x => x.clave === clave); if (f) f.valor = String(valor); else db.config.push({ clave, valor:String(valor) }); LS.set('dv_demo2', db); return; }
  const r = await sb.from('config').upsert({ clave, valor:String(valor) });
  if (r.error){ toast('No se pudo guardar: ' + r.error.message); throw r.error; }
}
function setSync(t){ $('hSync').textContent = t; }

/* Tiempo real: si Abigail confirma un pedido, al reparto le aparece al toque */
let rtCanal = null, rtTimer = null;
function tiempoReal(){
  if (DEMO || !sb || rtCanal) return;
  const aplicar = (tabla, payload) => {
    const arr = S[tabla];
    if (payload.eventType === 'DELETE'){ const i = arr.findIndex(x => x.id === payload.old.id); if (i >= 0) arr.splice(i, 1); }
    else { const n = payload.new; const i = arr.findIndex(x => x.id === n.id); if (i >= 0) arr[i] = n; else arr.push(n); }
    clearTimeout(rtTimer); rtTimer = setTimeout(() => { if (!$('sheet').classList.contains('open')) render(); }, 400);
  };
  rtCanal = sb.channel('dv-cambios')
    .on('postgres_changes', { event:'*', schema:'public', table:'pedidos' }, p => aplicar('pedidos', p))
    .on('postgres_changes', { event:'*', schema:'public', table:'clientes' }, p => aplicar('clientes', p))
    .subscribe();
}

  catch(e){ if (!silencioso) toast('No se pudo actualizar: ' + e.message); }
}

function guardarConexion(url, key){
  url = url.trim(); key = key.trim();
  if (!/^https:\/\/.+\.supabase\.co\/?$/.test(url) || key.length < 30) return toast('Revisá la URL y la key');
  LS.set('dv_sb', { url:url.replace(/\/$/, ''), key }); location.reload();

    id:'', fecha:hoy(), cliente_id:'', cliente_nombre:'', telefono:'', direccion:'', lat:null, lng:null, tipo_precio:'transferencia',
    items:[], estado:'Consulta', fecha_entrega:'', medio_pago:'Transferencia', cobrado:false, origen:'Meta / WhatsApp', notas:'',

/* Calculadora por m²: elige la combinación de baldes más barata que cubra lo necesario */
let CALC = { tipo:'techo', m2:'', manos:2, prod:'' };
function calcHTML(){
  const gs = grupos().filter(g => CALC.tipo === 'techo' ? /membrana/i.test(g.nombre) : /látex|latex/i.test(g.nombre));
  if (!gs.find(g => g.nombre === CALC.prod)) CALC.prod = (gs.find(g => /Poliuretánica$|Profesional/.test(g.nombre)) || gs[0] || {}).nombre || '';
  const rend = CALC.tipo === 'techo' ? 1.2 : 0.1; // kg/m² por mano (membrana) · L/m² por mano (látex ≈ 10 m²/L)
  const need = Math.ceil(num(CALC.m2) * rend * num(CALC.manos));
  const g = gs.find(x => x.nombre === CALC.prod);
  const combo = g && need ? mejorCombo(g.tams, need) : null;
  return `<div class="calc">
    <div class="seg" style="margin-bottom:8px"><button class="${CALC.tipo==='techo'?'on':''}" onclick="CALC.tipo='techo';drawPedido()">🛡️ Techo / muro</button><button class="${CALC.tipo==='pared'?'on':''}" onclick="CALC.tipo='pared';drawPedido()">🎨 Paredes</button></div>
    <div class="row"><div class="grow"><label class="f">m² a cubrir</label><input class="i" inputmode="decimal" id="calcM2" value="${esc(CALC.m2)}" oninput="CALC.m2=this.value;drawPedidoKeep('calcM2')"></div>
      <div style="width:110px"><label class="f">Manos</label><select class="i" onchange="CALC.manos=this.value;drawPedido()">${[1,2,3].map(n => `<option ${num(CALC.manos)===n?'selected':''}>${n}</option>`).join('')}</select></div></div>
    <label class="f">Producto</label><select class="i" onchange="CALC.prod=this.value;drawPedido()">${gs.map(x => `<option ${x.nombre===CALC.prod?'selected':''}>${esc(x.nombre)}</option>`).join('')}</select>
    ${need ? `<div style="margin-top:10px"><b>Necesita ≈ ${need} ${CALC.tipo==='techo'?'kg':'L'}</b> <span class="small muted">(${CALC.tipo==='techo'?'~1,2 kg/m² por mano':'~10 m²/L por mano'}; confirmar según el estado de la superficie)</span></div>
      ${combo ? `<div class="small" style="margin:6px 0 10px">Combinación más conveniente: <b>${combo.items.map(c => c.n + '× ' + c.p.medida + (g.unidad||'')).join(' + ')}</b> = ${fmt(combo.precio)}</div>
      <button class="btn brand sm block" onclick='aplicarCombo(${JSON.stringify(combo.items.map(c => [c.p.id, c.n]))})'>Agregar al pedido</button>` : ''}` : ''}
  </div>`;
}
function mejorCombo(tams, need){
  const max = need + Math.max(...tams.map(t => num(t.medida)));
  const best = Array(max + 1).fill(null); best[0] = { precio:0, pick:[] };
  for (let q = 0; q <= max; q++){
    if (!best[q]) continue;
    tams.forEach((t, k) => {
      const nq = q + num(t.medida); if (nq > max || !num(t.medida)) return;
      const pr = best[q].precio + precioUnit(t.costo, P ? P.tipo_precio : 'transferencia');
      if (!best[nq] || pr < best[nq].precio) best[nq] = { precio:pr, pick:best[q].pick.concat(k) };
    });
  }
  let op = null; for (let q = need; q <= max; q++) if (best[q] && (!op || best[q].precio < op.precio)) op = best[q];
  if (!op) return null;
  const cnt = {}; op.pick.forEach(k => cnt[k] = (cnt[k]||0) + 1);
  return { precio:op.precio, items:Object.keys(cnt).map(k => ({ p:tams[k], n:cnt[k] })).sort((a,b) => num(b.p.medida) - num(a.p.medida)) };
}

// Distancia en línea recta × 1,3 ≈ distancia por calle en ciudad
function km(a, b){
  const R = 6371, rad = x => x * Math.PI / 180;
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.3;
}
function partida(){
  const lat = cfg('PARTIDA_LAT', ''), lng = cfg('PARTIDA_LNG', '');
  return lat !== '' && lng !== '' ? { lat:num(lat), lng:num(lng), direccion:cfg('PARTIDA_DIRECCION','') } : null;
}
// Ruta más corta: vecino más cercano + mejora 2-opt (recorrido abierto, sin volver)
function optimizar(stops, inicio){
  const conGeo = stops.filter(tieneGeo), sinGeo = stops.filter(s => !tieneGeo(s));
  if (conGeo.length < 2) return conGeo.concat(sinGeo);
  let actual = inicio || conGeo[0], resto = conGeo.slice(), ruta = [];
  if (!inicio){ ruta.push(resto.shift()); actual = ruta[0]; }
  while (resto.length){
    let mejor = 0, md = Infinity;
    resto.forEach((s, i) => { const d = km(actual, s); if (d < md){ md = d; mejor = i; } });
    actual = resto.splice(mejor, 1)[0]; ruta.push(actual);
  }
  const largo = r => { let d = inicio ? km(inicio, r[0]) : 0; for (let i = 1; i < r.length; i++) d += km(r[i-1], r[i]); return d; };
  let mejora = true, vueltas = 0;
  while (mejora && vueltas++ < 50){
    mejora = false;
    for (let i = 0; i < ruta.length - 1; i++) for (let j = i + 1; j < ruta.length; j++){
      const nueva = ruta.slice(0, i).concat(ruta.slice(i, j + 1).reverse(), ruta.slice(j + 1));
      if (largo(nueva) < largo(ruta) - 0.01){ ruta = nueva; mejora = true; }
    }
  }
  return ruta.concat(sinGeo);
}
function paradasDelDia(fecha){
  const delDia = S.pedidos.filter(p => String(p.fecha_entrega || '').slice(0,10) === fecha);
  const pend = delDia.filter(p => p.estado === 'Confirmado')
    .sort((a,b) => (a.orden_ruta ?? 999) - (b.orden_ruta ?? 999) || String(a.id).localeCompare(String(b.id)));
  const hechos = delDia.filter(p => p.estado === 'Entregado').sort((a,b) => String(a.entregado_at||'').localeCompare(String(b.entregado_at||'')));
  return { pend, hechos };
}
function horaSalida(fecha){ return LS.get('dv_salida_' + fecha, null) || cfg('HORA_SALIDA', '09:30'); }
function etas(pend, fecha){
  const vel = Math.max(5, cfg('VEL_KMH', 25)), parada = cfg('MIN_POR_PARADA', 10);
  let t = aMin(horaSalida(fecha)), prev = partida(), totKm = 0;
  const out = pend.map(p => {
    let d = 0;
    if (tieneGeo(p) && prev && tieneGeo(prev)) d = km(prev, p);
    else if (prev) d = 4; // sin ubicación: suponemos ~4 km
    totKm += d; t += d / vel * 60;
    const llegada = t; t += parada;
    if (tieneGeo(p)) prev = p;
    return { id:p.id, km:d, llegada };
  });
  return { lista:out, km:totKm, fin:t };
}

  const opciones = [...new Set([...atrasados, hoy(), ...dias])].sort();

async function ordenarRuta(){
  const { pend } = paradasDelDia(UI.repFecha);
  if (pend.length < 2) return toast('Hace falta más de una parada');
  const ruta = optimizar(pend, partida());
  try{ await guardarVarios('pedidos', ruta.map((p, i) => ({ id:p.id, orden_ruta:i + 1 }))); }catch(e){ return; }
  render(); toast(partida() ? 'Ruta ordenada desde el punto de partida ✓' : 'Ruta ordenada ✓ (cargá el punto de partida en Configuración para que arranque desde ahí)');
}
async function mover(id, d){
  const { pend } = paradasDelDia(UI.repFecha);
  const i = pend.findIndex(p => p.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= pend.length) return;
  [pend[i], pend[j]] = [pend[j], pend[i]];
  try{ await guardarVarios('pedidos', pend.map((p, k) => ({ id:p.id, orden_ruta:k + 1 }))); }catch(e){ return; }
  render();
}
function cambiarSalida(){
  const v = prompt('¿A qué hora sale el reparto? (ej: 09:30)', horaSalida(UI.repFecha));
  if (v && /^\d{1,2}:\d{2}$/.test(v.trim())){ LS.set('dv_salida_' + UI.repFecha, v.trim().padStart(5,'0')); render(); }
}
function salirAhora(){ const d = new Date(); LS.set('dv_salida_' + UI.repFecha, hhmm(d.getHours() * 60 + d.getMinutes())); render(); toast('Horarios recalculados desde ahora'); }
async function marcarEntregado(id){
  const p = S.pedidos.find(x => x.id === id);
  try{ await guardar('pedidos', { id, estado:'Entregado', entregado_at:new Date().toISOString(), orden_ruta:null, cobrado:p.cobrado }); }catch(e){ return; }
  render(); toast('Entregado ✓ ' + (esSi(p.cobrado) ? '' : '· acordate de marcar si cobraste'));
}
async function deshacerEntrega(id){ try{ await guardar('pedidos', { id, estado:'Confirmado', entregado_at:null }); }catch(e){ return; } render(); }
async function marcarCobrado(id){ try{ await guardar('pedidos', { id, cobrado:true }); }catch(e){ return; } render(); toast('Cobrado ✓'); }
async function guardarUbicacionAca(id){
  try{
    const g = await miUbicacion();
    const p = S.pedidos.find(x => x.id === id);
    await guardar('pedidos', { id, lat:g.lat, lng:g.lng });
    if (p.cliente_id && S.clientes.some(c => c.id === p.cliente_id)) await guardar('clientes', { id:p.cliente_id, lat:g.lat, lng:g.lng });
    render(); toast('Ubicación del cliente guardada para la próxima ✓');
  }catch(e){ toast(e.message || 'No se pudo'); }
}
let mapa = null;
function dibujarMapa(){
  const el = $('mapa'); if (!el || !window.L) { if (el) el.classList.add('hidden'); return; }
  const { pend } = paradasDelDia(UI.repFecha);
  const pts = pend.filter(tieneGeo);
  const ini = partida();
  if (!pts.length && !ini){ el.classList.add('hidden'); return; }
  mapa = L.map(el, { zoomControl:false, attributionControl:true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(mapa);
  const icon = (txt, cls) => L.divIcon({ className:'', html:`<div class="pin ${cls||''}">${txt}</div>`, iconSize:[28,28], iconAnchor:[14,14] });
  const linea = [];
  if (ini){ L.marker([ini.lat, ini.lng], { icon:icon('🏁','start') }).addTo(mapa).bindPopup('Salida'); linea.push([ini.lat, ini.lng]); }
  pend.forEach((p, i) => { if (!tieneGeo(p)) return; L.marker([p.lat, p.lng], { icon:icon(i+1, i===0 ? 'next' : '') }).addTo(mapa).bindPopup(`<b>${i+1}. ${esc(p.cliente_nombre)}</b><br>${esc(p.direccion||'')}`); linea.push([p.lat, p.lng]); });
  if (linea.length > 1) L.polyline(linea, { color:'#E85D26', weight:3, opacity:.8, dashArray:'6 6' }).addTo(mapa);
  if (linea.length === 1) mapa.setView(linea[0], 14); else mapa.fitBounds(linea, { padding:[30,30] });
}

VIEWS.resumen = () => {
  const ahora = new Date();
  if (!UI.mes) UI.mes = isoDate(ahora).slice(0,7);
  const meses = []; for (let i = 0; i < 4; i++){ const d = new Date(ahora.getFullYear(), ahora.getMonth() - i, 1); meses.push(isoDate(d).slice(0,7)); }
  const delMes = S.pedidos.filter(p => String(p.fecha).slice(0,7) === UI.mes);
  const vend = delMes.filter(p => VENDIDO.includes(p.estado));
  const tot = k => vend.reduce((s,p) => s + num(calcPedido(p)[k]), 0);
  const ventas = tot('total'), bruta = tot('ganancia');
  const gastosMes = S.gastos.filter(g => String(g.fecha).slice(0,7) === UI.mes);
  const gastos = gastosMes.reduce((s,g) => s + num(g.monto), 0);
  const neto = bruta - gastos;
  const obj = cfg('OBJETIVO_NETO_MES', 3000000), socios = cfg('SOCIOS', 3);
  const pct = Math.max(0, Math.min(100, neto / obj * 100));
  const definidos = delMes.filter(p => VENDIDO.includes(p.estado) || p.estado === 'Perdido').length;
  const cierre = definidos ? Math.round(vend.length / definidos * 100) : 0;
  const pubGasto = gastosMes.filter(g => g.categoria === 'Publicidad').reduce((s,g) => s + num(g.monto), 0);
  const deuda = S.pedidos.filter(p => VENDIDO.includes(p.estado) && !esSi(p.cobrado));
  const porOrigen = {}; delMes.forEach(p => { const o = p.origen || 'Otro'; porOrigen[o] = porOrigen[o] || { c:0, v:0 }; porOrigen[o].c++; if (VENDIDO.includes(p.estado)) porOrigen[o].v++; });
  const maxO = Math.max(1, ...Object.values(porOrigen).map(x => x.c));
  const [y, m] = UI.mes.split('-').map(Number); const diasMes = new Date(y, m, 0).getDate();
  const diaHoy = UI.mes === isoDate(ahora).slice(0,7) ? ahora.getDate() : diasMes;
  const proy = neto / diaHoy * diasMes;
  return `
    <div class="chips">${meses.map(mm => { const [a,b] = mm.split('-'); return `<button class="chip ${UI.mes===mm?'on':''}" onclick="UI.mes='${mm}';render()">${MESES[num(b)-1]} ${a}</button>`; }).join('')}</div>
    <div class="card">
      <div class="small muted" style="font-weight:600">Ganancia neta del mes</div>
      <div class="row" style="align-items:baseline"><div class="cond grow" style="font-size:38px;font-weight:800">${fmt(neto)}</div><div class="small muted">objetivo ${fmt(obj)}</div></div>
      <div class="bar" style="margin:8px 0"><div style="width:${pct}%"></div></div>
      <div class="row small"><div class="grow muted">${Math.round(pct)}% · a este ritmo: ${fmt(proy)}</div><div><b>${fmt(neto / socios)}</b> c/u</div></div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="l">Ventas</div><div class="v">${fmt(ventas)}</div></div>
      <div class="kpi"><div class="l">Ganancia bruta</div><div class="v">${fmt(bruta)}</div></div>
      <div class="kpi"><div class="l">Pedidos vendidos</div><div class="v">${vend.length}</div></div>
      <div class="kpi"><div class="l">Ticket promedio</div><div class="v">${fmt(vend.length ? ventas / vend.length : 0)}</div></div>
      <div class="kpi"><div class="l">Gastos</div><div class="v">${fmt(gastos)}</div></div>
      <div class="kpi"><div class="l">Publicidad por venta</div><div class="v">${fmt(vend.length ? pubGasto / vend.length : 0)}</div></div>
    </div>
    <div class="card">
      <div class="row"><h3 class="grow" style="font-size:19px">Consultas por origen</h3><span class="small muted">${delMes.length} · cierre ${cierre}%</span></div>
      ${Object.keys(porOrigen).length ? Object.entries(porOrigen).sort((a,b) => b[1].c - a[1].c).map(([o,x]) => `<div class="hbar"><div class="t">${esc(o)}</div><div class="b"><div style="width:${x.c/maxO*100}%"></div></div><div class="n">${x.v}/${x.c}</div></div>`).join('') : '<div class="small muted">Sin datos este mes.</div>'}
      <div class="small muted" style="margin-top:6px">vendidos / consultas. El % de cierre cuenta solo las consultas que ya se definieron (vendidas o perdidas).</div>
    </div>
    <div class="card">
      <div class="row"><h3 class="grow" style="font-size:19px">Falta cobrar</h3><b>${fmt(deuda.reduce((s,p) => s + num(p.total), 0))}</b></div>
      ${deuda.slice(0,10).map(p => `<div class="row small" style="padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer" onclick="formPedido('${esc(p.id)}')"><div class="grow">${esc(p.cliente_nombre)} <span class="muted">· ${esc(p.estado)} ${p.fecha_entrega ? fechaCorta(p.fecha_entrega) : ''}</span></div><b>${fmt(p.total)}</b></div>`).join('') || '<div class="small muted">Todo cobrado.</div>'}
    </div>
    <button class="btn ghost block" onclick="go('gastos')">Cargar gastos (publicidad, nafta…)</button>`;
};

  ['Seguimiento (no respondió)', `¡Hola {nombre}! ¿Pudiste ver el presupuesto? Esta semana tenemos entregas el martes y el viernes, si lo confirmás hoy entrás en la próxima 🚚`],
  ['Después de la entrega', `¡Hola {nombre}! ¿Llegó todo bien? Si quedó buena la terminación, nos ayudás muchísimo mandándonos una foto 📸\nY si algún conocido necesita pintura o membrana, pasale este número 🙌`],
  ['Mayorista — primer contacto', `¡Hola! Soy {tu nombre}, de Deco & Vita. Somos distribuidores de Mega Pinturas (Dupaint, Zi-Muro) en Córdoba.\nTenemos precios mayoristas en membranas y látex para reventa, con entrega en el local.\n¿Con quién puedo hablar para pasarle la lista?`],
];
VIEWS.respuestas = () => `<div class="small muted" style="margin-bottom:10px">Tocá <b>Copiar</b> y pegala en el chat. Reemplazá lo que está entre {llaves}.</div>` +
  PLANTILLAS.map(([t, txt], i) => `<div class="card"><div class="row"><b class="grow">${esc(t)}</b><button class="btn ghost sm" onclick="copiar(PLANTILLAS[${i}][1])">Copiar</button></div><div class="tpl">${esc(txt)}</div></div>`).join('');

VIEWS.gastos = () => {
  const lista = [...S.gastos].sort((a,b) => String(b.fecha).localeCompare(String(a.fecha)));
  return `<div class="card">
      <h3 style="font-size:19px">Nuevo gasto</h3>
      <div class="row" style="gap:10px"><div class="grow"><label class="f">Fecha</label><input type="date" class="i" id="gF" value="${hoy()}"></div>
        <div class="grow"><label class="f">Monto</label><input class="i" id="gM" inputmode="numeric" placeholder="$"></div></div>
      <label class="f">Categoría</label><select class="i" id="gC">${CAT_GASTOS.map(c => `<option>${c}</option>`).join('')}</select>
      <label class="f">Nota</label><input class="i" id="gN" placeholder="Ej: Meta 1–15 nov">
      <button class="btn brand block" style="margin-top:12px" onclick="guardarGasto()">Guardar gasto</button>
    </div>
    ${lista.map(g => `<div class="card row"><div class="grow"><b>${esc(g.categoria)}</b><div class="small muted">${fechaCorta(g.fecha)}${g.nota ? ' · ' + esc(g.nota) : ''}</div></div><b>${fmt(g.monto)}</b></div>`).join('') || '<div class="empty">Sin gastos cargados.</div>'}`;
};
async function guardarGasto(){
  const monto = num($('gM').value); if (!monto) return toast('Poné el monto');
  try{ await guardar('gastos', { fecha:$('gF').value || hoy(), categoria:$('gC').value, monto, nota:$('gN').value }); }catch(e){ return; }
  render(); toast('Gasto guardado ✓');
}

VIEWS.productos = () => `<div class="small muted" style="margin-bottom:10px">Cuando la fábrica mande lista nueva, cambiá el costo acá. Los precios se recalculan solos (transferencia = costo × ${cfg('MARKUP',1.35)}).</div>` +
  grupos().map(g => `<div class="card"><b>${esc(g.nombre)}</b>${g.tams.map(p => `
    <div class="row" style="margin-top:8px"><div style="width:60px" class="small">${esc(p.medida)} ${esc(g.unidad)}</div>
      <input class="i grow" inputmode="numeric" value="${num(p.costo)}" onchange="guardarCosto('${esc(p.id)}', this.value)">
      <div class="small right" style="width:96px">${fmt(precioUnit(p.costo,'transferencia'))}<br><span class="muted">may. ${fmt(precioUnit(p.costo,'mayorista'))}</span></div></div>`).join('')}</div>`).join('');
async function guardarCosto(id, v){ try{ await guardar('productos', { id, costo:num(v) }); }catch(e){ return; } render(); toast('Costo actualizado ✓'); }

let PARTIDA = null;
VIEWS.config = () => {
  PARTIDA = PARTIDA || { direccion:cfg('PARTIDA_DIRECCION',''), lat:cfg('PARTIDA_LAT','') === '' ? null : num(cfg('PARTIDA_LAT','')), lng:cfg('PARTIDA_LNG','') === '' ? null : num(cfg('PARTIDA_LNG','')) };
  return `
  <div class="card">
    <h3 style="font-size:19px">Reparto</h3>
    <label class="f">Punto de partida (ej: la fábrica)</label>
    <input class="i" value="${esc(PARTIDA.direccion)}" oninput="PARTIDA.direccion=this.value" placeholder="Dirección de donde sale el reparto">
    ${geoHTML(PARTIDA, 'PARTIDA', 'render')}
    <div class="row" style="gap:10px">
      <div class="grow"><label class="f">Hora de salida</label><input class="i" id="cfgHora" value="${esc(cfg('HORA_SALIDA','09:30'))}" placeholder="09:30"></div>
      <div class="grow"><label class="f">Min. por parada</label><input class="i" id="cfgParada" inputmode="numeric" value="${esc(cfg('MIN_POR_PARADA',10))}"></div>
      <div class="grow"><label class="f">Velocidad km/h</label><input class="i" id="cfgVel" inputmode="numeric" value="${esc(cfg('VEL_KMH',25))}"></div>
    </div>
    <button class="btn brand block" style="margin-top:12px" onclick="guardarConfigReparto()">Guardar</button>
  </div>
  <div class="card">
    <h3 style="font-size:19px">Precios y objetivo</h3>
    ${[['MARKUP','Markup transferencia'],['RECARGO_TARJETA','Recargo tarjeta'],['COMISION_TARJETA','Comisión tarjeta (0.25 = 25%)'],['MARKUP_MAYORISTA','Markup mayorista'],['OBJETIVO_NETO_MES','Objetivo neto del mes'],['SOCIOS','Socios']].map(([k,l]) => `
      <div class="row" style="margin-top:8px"><div class="grow small">${l}</div><input class="i" style="width:140px" inputmode="decimal" value="${esc(cfg(k,''))}" onchange="guardarConfigClave('${k}', this.value).then(()=>toast('Guardado ✓'))"></div>`).join('')}
  </div>
  <div class="card small">
    <b>Instalar en el celular</b>
    <div class="muted" style="margin-top:6px">Android (Chrome): menú ⋮ → <i>Agregar a pantalla principal</i>.<br>iPhone (Safari): botón compartir → <i>Agregar a inicio</i>.</div>
  </div>
  ${DEMO ? `<button class="btn ghost block" onclick="if(confirm('¿Borrar los datos de prueba?')){LS.del('dv_demo2');refrescar()}">Borrar datos de prueba</button>` : ''}`;
};
async function guardarConfigReparto(){
  try{
    if (PARTIDA.direccion && !tieneGeo(PARTIDA)){ const g = await geocodificar(PARTIDA.direccion); if (g){ PARTIDA.lat = g.lat; PARTIDA.lng = g.lng; } }
    await guardarConfigClave('PARTIDA_DIRECCION', PARTIDA.direccion || '');
    await guardarConfigClave('PARTIDA_LAT', tieneGeo(PARTIDA) ? PARTIDA.lat : '');
    await guardarConfigClave('PARTIDA_LNG', tieneGeo(PARTIDA) ? PARTIDA.lng : '');
    const h = $('cfgHora').value.trim(); if (/^\d{1,2}:\d{2}$/.test(h)) await guardarConfigClave('HORA_SALIDA', h.padStart(5,'0'));
    await guardarConfigClave('MIN_POR_PARADA', num($('cfgParada').value) || 10);
    await guardarConfigClave('VEL_KMH', num($('cfgVel').value) || 25);
    PARTIDA = null; render(); toast('Guardado ✓' + (cfg('PARTIDA_LAT','') === '' ? ' (sin ubicar el punto de partida)' : ''));
  }catch(e){}
}

/* ----------------------------- arranque ----------------------------- */
(async function(){
  if (sb){
    const { data } = await sb.auth.getSession();
    if (data && data.session) return iniciar();
  }
  showLogin();
})();
</script>
</body>
